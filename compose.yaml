# Optional isolated local demo database. Never points at an existing service.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: pluto_demo
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: pluto_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/migrations/002_auth_sessions.sql:/docker-entrypoint-initdb.d/002_auth_sessions.sql:ro
      - ./db/migrations/003_idempotency.sql:/docker-entrypoint-initdb.d/003_idempotency.sql:ro
      - ./db/migrations/004_local_credentials.sql:/docker-entrypoint-initdb.d/004_local_credentials.sql:ro
      - ./db/migrations/005_jobs.sql:/docker-entrypoint-initdb.d/005_jobs.sql:ro
      - ./db/migrations/006_authentication.sql:/docker-entrypoint-initdb.d/006_authentication.sql:ro
      - ./db/fixtures.sql:/docker-entrypoint-initdb.d/007_fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluto_demo -d pluto_demo"]
      interval: 2s
      timeout: 2s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3-alpine
    profiles: ["cache"]
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--requirepass", "local_only", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=local_only valkey-cli ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.10
    environment:
      MP_MAX_MESSAGES: 100
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

# Optional isolated local demo database. Never points at an existing service.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: pluto_demo
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: pluto_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/migrations/002_auth_sessions.sql:/docker-entrypoint-initdb.d/002_auth_sessions.sql:ro
      - ./db/fixtures.sql:/docker-entrypoint-initdb.d/003_fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluto_demo -d pluto_demo"]
      interval: 2s
      timeout: 2s
      retries: 20

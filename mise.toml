[tools]
node = "24.22.1"
golangci-lint = "2.15.0"

[tasks.fmt]
description = "Apply Go formatting and whitespace fixes"
run = "./scripts/fmt.sh"

[tasks.lint]
description = "Check Go formatting, spacing, and static analysis without edits"
run = "./scripts/golangci.sh run ./..."

[tasks.check]
description = "Run lint, tests, vet, file limits, and generated contract checks"
run = "./scripts/check.sh"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./cmd/... ./internal/..."

[tasks.worker]
description = "Run the audit delivery worker using the exported app environment"
run = "go run ./cmd/worker"

[tasks.web]
description = "Run the local HTTPS React application"
run = "npm --prefix web run dev"

[tasks."web:check"]
description = "Check contracts, architecture, formatting, types, tests and build"
run = "./scripts/frontend-check.sh"

[tasks."web:fmt"]
description = "Format frontend source"
run = "npm --prefix web run fmt"

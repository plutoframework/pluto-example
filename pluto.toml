schema_version = 1

[project]
name = "pluto-example"
module = "github.com/plutoframework/pluto-example"
env_prefix = "PLUTO_EXAMPLE_"

[capabilities]
# Deliberate for this purchasing example; a future framework defaults to single.
tenancy = "multi"
cache = "memory"

[database]
engine = "postgres"
queries = "sqlc"

[development]
local_store = "postgres"
local_credentials = true

[frontend]
ui = "heroui-v3"
template_version = 1
framework = "react"
directory = "web"
router = "tanstack"
package_manager = "npm"

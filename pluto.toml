schema_version = 1

[project]
name = "pluto-example"
module = "github.com/plutoframework/pluto-example"
env_prefix = "PLUTO_EXAMPLE_"

[capabilities]
# Deliberate for this purchasing example; a future framework defaults to single.
tenancy = "multi"
cache = "memory"

[database]
engine = "postgres"
queries = "sqlc"

[development]
local_store = "postgres"
local_credentials = true

[frontend]
ui = "heroui-v3"
template_version = 1
framework = "react"
directory = "web"
router = "tanstack"
package_manager = "npm"

[frontend.theme]
mode = "dark"
font_family = "Manrope, sans-serif"
overrides = "web/src/styles/overrides.css"

# Empty token tables preserve HeroUI defaults. Optional examples:
# [frontend.theme.light]
# accent = "#006FEE"
# accent_foreground = "#FFFFFF"
# [frontend.theme.dark]
# accent = "#338EF7"
# background = "#09090B"
